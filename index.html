<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <link rel="stylesheet" href="miniapp.css" type="text/css" media="all">
    <title>Y - Ваш ключ от будущего!</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
</head>
<body>

<main>
    <input id="tab1" type="radio" name="tabs" checked>
    <label for="tab1">Ваши данные</label>
    <input id="tab2" type="radio" name="tabs">
    <label for="tab2">Y-Карта</label>
    <input id="tab3" type="radio" name="tabs">
    <label for="tab3">Y-MBA</label>
    <input id="tab4" type="radio" name="tabs">
    <label for="tab4">Баланс</label>

    <section id="content1">
        <div class="dashboard">
            <div class="user-info">
                <h2>👤 Личная информация</h2>
                <p><strong>ID:</strong> <span id="user-id">—</span></p>
                <p><strong>Имя:</strong> <span id="user-name">—</span></p>
                <p><strong>Username:</strong> <span id="user-username">—</span></p>
            </div>
            <div id="qr-place"></div>
        </div>
    </section>

    <section id="content2">
        <h2>Y-Карта</h2>
        <p><select id="card_programs" name="Y-card"><option value="">Выберите...</option></select></p>
        <p id="selected_program"></p>
        <div class="payment-method-block">
            <h3>Способ оплаты</h3>
            <label><input type="radio" name="payment_method_card" value="stars" checked> ⭐ Telegram Stars</label>
            <label><input type="radio" name="payment_method_card" value="card"> 💳 Банковская карта</label>
            <label><input type="radio" name="payment_method_card" value="yoomoney"> 💰 YooMoney</label>
        </div>
        <div class="offer-agreement">
            <input type="checkbox" id="agree-offer-card">
            <label for="agree-offer-card">Я ознакомлен(а) и согласен(сна) с условиями <a href="javascript:void(0)" data-offer-type="card" class="offer-link">Публичной оферты (Y‑Карта)</a></label>
        </div>
    </section>

    <section id="content3">
        <h2>Y-MBA</h2>
        <p><select id="Y_cources" name="Y-MBA"><option value="">Выберите...</option></select></p>
        <p id="selected_cource"></p>
        <div class="payment-method-block">
            <h3>Способ оплаты</h3>
            <label><input type="radio" name="payment_method_mba" value="stars" checked> ⭐ Telegram Stars</label>
            <label><input type="radio" name="payment_method_mba" value="card"> 💳 Банковская карта</label>
            <label><input type="radio" name="payment_method_mba" value="yoomoney"> 💰 YooMoney</label>
        </div>
        <div class="offer-agreement">
            <input type="checkbox" id="agree-offer-mba">
            <label for="agree-offer-mba">Я ознакомлен(а) и согласен(сна) с условиями <a href="javascript:void(0)" data-offer-type="mba" class="offer-link">Публичной оферты (Y‑MBA)</a></label>
        </div>
    </section>

    <section id="content4">
        <div class="balance-dashboard">
            <div class="wallet-card">
                <div class="wallet-header">
                    <div class="wallet-title">
                        <i class="fa fa-connectdevelop" aria-hidden="true"></i> 
                        <span>TON Wallet</span>
                    </div>
                    <div id="ton-connect-place"></div>
                </div>
                <div class="balance-grid">
                    <div class="balance-item">
                        <div class="balance-left">
                            <div class="balance-icon">💎</div>
                            <div class="balance-info">
                                <h4>TON</h4>
                                <small>Основная сеть</small>
                            </div>
                        </div>
                        <div class="balance-value" id="ton-balance">0.00 <span>TON</span></div>
                    </div>
                    <div class="balance-item">
                        <div class="balance-left">
                            <div class="balance-icon">🪙</div>
                            <div class="balance-info">
                                <h4>Y-D</h4>
                                <small>Токен экосистемы</small>
                            </div>
                        </div>
                        <div class="balance-value" id="yd-balance">0.00 <span>Y-D</span></div>
                    </div>
                </div>
                <div style="padding: 0 20px 20px 20px;">
                    <button id="refreshBalanceBtn" class="refresh-balance"><i class="fa fa-refresh"></i> Обновить баланс</button>
                </div>
            </div>

            <div class="network-bar">
                <div class="network-buttons">
                    <button id="mainnetBtn" class="network-btn active">🌍 Mainnet</button>
                    <button id="testnetBtn" class="network-btn">🧪 Testnet</button>
                </div>
                <!-- Кнопка "Отключить кошелёк" удалена -->
            </div>
            <div id="walletStatusMsg" class="status-message">
                💡 Загрузка TON Connect...
            </div>
        </div>
    </section>
</main>

<div id="offerModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📄 Публичная оферта</h3>
            <span class="close-modal" id="closeModalBtn">&times;</span>
        </div>
        <div class="modal-body" id="modalOfferBody">Загрузка...</div>
    </div>
</div>

<script>
    // ---------------------- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ -------------------------
    let c_programs = [];
    let y_cources = [];
    let selectedProduct = null;
    let tgUser = null;
    let tg = null;
    let cachedOffers = { card: null, mba: null };
    
    // Wallet state
    let tonConnectUI = null;
    let walletConnected = false;
    let currentNetwork = 'mainnet';
    let currentWalletAddress = null;
    
    // Конфигурация TON API (если ключ не работает, используйте публичный эндпоинт)
    const TONCENTER_API_KEY = '70abed234ae5b8c649d7bd66031ea086d06f71ed861516b5d7768de807d5b81a'; // Замените на свой
    // Для публичного доступа (без ключа) раскомментируйте следующие строки и закомментируйте верхние:
    // const MAINNET_API = 'https://toncenter.com/api/v2/getAddressInformation?address=';
    // const TESTNET_API = 'https://testnet.toncenter.com/api/v2/getAddressInformation?address=';
    const MAINNET_API = `https://toncenter.com/api/v2/?api_key=${TONCENTER_API_KEY}`;
    const TESTNET_API = `https://testnet.toncenter.com/api/v2/?api_key=${TONCENTER_API_KEY}`;
    
    const YD_JETTON_MASTER = 'EQDxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'; // Замените на реальный адрес
    
    function getApiBase() {
        return currentNetwork === 'mainnet' ? MAINNET_API : TESTNET_API;
    }
    
    // Улучшенная проверка адреса
    function isValidTonAddress(address) {
        if (!address || typeof address !== 'string') return false;
        address = address.trim();
        if ((address.startsWith('EQ') || address.startsWith('UQ')) && address.length >= 40) return true;
        if (/^0:[0-9a-fA-F]{64}$/.test(address) || /^[0-9a-fA-F]{64}$/.test(address)) return true;
        return false;
    }
    
    // ---------------------- TELEGRAM -------------------------
    if (window.Telegram && window.Telegram.WebApp) { 
        tg = window.Telegram.WebApp; 
        tg.ready(); 
        tg.expand(); 
    }
    
    function getTelegramUser() {
        if (!tg) return null;
        if (tg.initDataUnsafe?.user) return tg.initDataUnsafe.user;
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');
        if (userId) return { id: parseInt(userId,10), first_name: decodeURIComponent(urlParams.get('first_name') || ''), username: decodeURIComponent(urlParams.get('username') || '') };
        return null;
    }
    
    tgUser = getTelegramUser();
    const tgButtonColor = tg ? tg.themeParams.button_color || '#30a2ff' : '#30a2ff';
    if (tgUser) {
        document.getElementById('user-id').innerHTML = tgUser.id.toString();
        document.getElementById('user-name').innerHTML = tgUser.first_name || 'Пользователь';
        document.getElementById('user-username').innerHTML = tgUser.username ? '@' + tgUser.username : '—';
        displayQRCode('#qr-place', tgUser.id.toString(), 180, tgButtonColor);
    } else {
        document.getElementById('user-id').innerHTML = "Не удалось определить пользователя.";
        displayQRCode('#qr-place', 'Пользователь не известен', 180, tgButtonColor);
    }
    
    function displayQRCode(container, text, size, color, margin = 2) {
        const target = typeof container === 'string' ? document.querySelector(container) : container;
        if (!target) return;
        let darkColor = '#000000', lightColor = '#ffffff';
        if (typeof color === 'string') darkColor = color;
        target.innerHTML = '';
        const canvas = document.createElement('canvas');
        target.appendChild(canvas);
        QRCode.toCanvas(canvas, text, { width: size, margin, color: { dark: darkColor, light: lightColor } }, (error) => {
            if (error) target.innerHTML = '<p style="color:red;">Ошибка QR</p>';
        });
    }
    
    // ---------------------- ЗАГРУЗКА КАТАЛОГА -------------------------
    fetch('content.json').then(r => r.json()).then(data => {
        c_programs = data[5].product;
        const s1 = document.getElementById('card_programs');
        c_programs.forEach(item => { let opt = document.createElement('option'); opt.value = item.level; opt.textContent = `${item.level} (${item.price} руб.)`; s1.appendChild(opt); });
        y_cources = data[6];
        const s2 = document.getElementById('Y_cources');
        y_cources.forEach(item => { let opt = document.createElement('option'); opt.value = item.level; opt.textContent = `${item.level} (${item.price} руб.)`; s2.appendChild(opt); });
    }).catch(err => console.error("Ошибка загрузки каталога:", err));
    
    // ---------------------- ОФЕРТЫ И МОДАЛЬНЫЕ ОКНА -------------------------
    function loadOfferByType(type) {
        if (cachedOffers[type]) return Promise.resolve(cachedOffers[type]);
        const fileName = type === 'card' ? 'offer_card.html' : 'offer_mba.html';
        return fetch(fileName).then(r => { if(!r.ok) throw new Error(); return r.text(); }).then(html => { cachedOffers[type] = html; return html; })
        .catch(() => { const fallback = `<div style="padding:20px;">⚠️ Текст оферты временно недоступен</div>`; cachedOffers[type] = fallback; return fallback; });
    }
    function showOfferModal(offerType) {
        const modal = document.getElementById('offerModal'), body = document.getElementById('modalOfferBody');
        if(!modal) return;
        body.innerHTML = '<div style="text-align:center;">⏳ Загрузка...</div>';
        modal.style.display = 'flex';
        loadOfferByType(offerType).then(html => { body.innerHTML = html; });
    }
    function closeOfferModal() { const modal = document.getElementById('offerModal'); if(modal) modal.style.display = 'none'; }
    document.querySelectorAll('.offer-link').forEach(link => link.addEventListener('click', (e) => { e.preventDefault(); showOfferModal(link.dataset.offerType); }));
    document.getElementById('closeModalBtn')?.addEventListener('click', closeOfferModal);
    window.onclick = (event) => { if(event.target === document.getElementById('offerModal')) closeOfferModal(); };
    
    // ---------------------- ЛОГИКА ПОКУПКИ (MAIN BUTTON) -------------------------
    function getSelectedPaymentMethod() {
        const activeTabId = document.querySelector('input[name="tabs"]:checked')?.id;
        if (activeTabId === 'tab2') return document.querySelector('#content2 input[name="payment_method_card"]:checked')?.value || 'stars';
        if (activeTabId === 'tab3') return document.querySelector('#content3 input[name="payment_method_mba"]:checked')?.value || 'stars';
        return 'stars';
    }
    function updateMainButton() {
        if (!tg) return;
        const activeTabId = document.querySelector('input[name="tabs"]:checked')?.id;
        if (!selectedProduct) { tg.MainButton.hide(); return; }
        const productTab = selectedProduct.type === 'card' ? 'tab2' : 'tab3';
        if (activeTabId === productTab) {
            let isOfferAccepted = (selectedProduct.type === 'card') ? (document.getElementById('agree-offer-card')?.checked || false) : (document.getElementById('agree-offer-mba')?.checked || false);
            if (isOfferAccepted) { tg.MainButton.setParams({ is_visible: true, text: "Купить" }); tg.MainButton.show(); }
            else tg.MainButton.hide();
        } else tg.MainButton.hide();
    }
    function updateSelectedProgram() {
        const select = document.getElementById('card_programs');
        const idx = select.selectedIndex;
        if (idx > 0) { const item = c_programs[idx-1]; document.getElementById('selected_program').innerHTML = item.description; selectedProduct = { type: 'card', level: item.level, price: parseInt(item.price,10) }; }
        else { document.getElementById('selected_program').innerHTML = 'Ничего не выбрано'; if(selectedProduct?.type==='card') selectedProduct=null; }
        updateMainButton();
    }
    function updateSelectedCource() {
        const select = document.getElementById('Y_cources');
        const idx = select.selectedIndex;
        if (idx > 0) { const item = y_cources[idx-1]; document.getElementById('selected_cource').innerHTML = item.description; selectedProduct = { type: 'mba', level: item.level, price: parseInt(item.price,10) }; }
        else { document.getElementById('selected_cource').innerHTML = 'Ничего не выбрано'; if(selectedProduct?.type==='mba') selectedProduct=null; }
        updateMainButton();
    }
    document.getElementById('card_programs')?.addEventListener('change', updateSelectedProgram);
    document.getElementById('Y_cources')?.addEventListener('change', updateSelectedCource);
    document.getElementById('agree-offer-card')?.addEventListener('change', updateMainButton);
    document.getElementById('agree-offer-mba')?.addEventListener('change', updateMainButton);
    document.querySelectorAll('input[name="tabs"]').forEach(tab => tab.addEventListener('change', updateMainButton));
    if(tg) { tg.MainButton.onClick(() => {
        if(!selectedProduct) { tg.showAlert("Выберите продукт"); return; }
        let isAccepted = (selectedProduct.type === 'card') ? document.getElementById('agree-offer-card')?.checked : document.getElementById('agree-offer-mba')?.checked;
        if(!isAccepted) { tg.showAlert("Подтвердите оферту"); return; }
        tg.sendData(JSON.stringify({ type: selectedProduct.type, level: selectedProduct.level, price: selectedProduct.price, payment_method: getSelectedPaymentMethod() }));
        clearSelectedProduct();
        tg.showAlert("✅ Запрос отправлен");
    }); }
    function clearSelectedProduct() { selectedProduct = null; document.getElementById('card_programs').selectedIndex=0; document.getElementById('Y_cources').selectedIndex=0; document.getElementById('selected_program').innerHTML='Ничего не выбрано'; document.getElementById('selected_cource').innerHTML='Ничего не выбрано'; updateMainButton(); }
    
    // ======================== TON CONNECT ========================
    function loadTonConnectScript() {
        return new Promise((resolve, reject) => {
            if (window.TON_CONNECT_UI && window.TON_CONNECT_UI.TonConnectUI) {
                resolve();
                return;
            }
            const urls = [
                'https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js',
                'https://cdn.jsdelivr.net/npm/@tonconnect/ui@latest/dist/tonconnect-ui.min.js'
            ];
            let idx = 0;
            function attemptLoad() {
                if (idx >= urls.length) {
                    reject(new Error('Не удалось загрузить TON Connect UI'));
                    return;
                }
                const script = document.createElement('script');
                script.src = urls[idx];
                script.onload = () => {
                    if (window.TON_CONNECT_UI && window.TON_CONNECT_UI.TonConnectUI) resolve();
                    else reject(new Error('Конструктор не найден'));
                };
                script.onerror = () => { idx++; attemptLoad(); };
                document.head.appendChild(script);
            }
            attemptLoad();
        });
    }
    
    async function initTonConnect() {
        try {
            await loadTonConnectScript();
            await new Promise(r => setTimeout(r, 50));
            const manifestUrl = 'https://binom0x.github.io/Y-bot/tonconnect-manifest.json';
            const manifestCheck = await fetch(manifestUrl, { method: 'HEAD', cache: 'no-store' });
            if (!manifestCheck.ok) throw new Error(`Манифест недоступен (HTTP ${manifestCheck.status})`);
            
            tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                manifestUrl: manifestUrl,
                buttonRootId: 'ton-connect-place'
            });
            
            tonConnectUI.onStatusChange(async (wallet) => {
                if (wallet) {
                    walletConnected = true;
                    currentWalletAddress = wallet.account.address;
                    console.log("✅ Кошелёк подключён, адрес:", currentWalletAddress);
                    document.getElementById('walletStatusMsg').innerHTML = `✅ Кошелёк подключён: ${currentWalletAddress.slice(0,6)}...${currentWalletAddress.slice(-4)}`;
                    await fetchBalances();
                } else {
                    walletConnected = false;
                    currentWalletAddress = null;
                    document.getElementById('ton-balance').innerHTML = '0.00 <span>TON</span>';
                    document.getElementById('yd-balance').innerHTML = '0.00 <span>Y-D</span>';
                    document.getElementById('walletStatusMsg').innerHTML = '🔌 Кошелёк не подключён. Нажмите «Подключить TON Wallet»';
                }
            });
            document.getElementById('walletStatusMsg').innerHTML = '💡 Нажмите кнопку, чтобы подключить кошелёк';
        } catch (err) {
            console.error('TON Connect init error:', err);
            document.getElementById('walletStatusMsg').innerHTML = `⚠️ Ошибка: ${err.message}. Включён демо-режим.`;
            enableDemoMode();
        }
    }
    
    function enableDemoMode() {
        const container = document.getElementById('ton-connect-place');
        if (!container) return;
        container.innerHTML = '<button class="connect-btn" id="mockConnectBtn">🔗 Демо-подключение</button>';
        const mockBtn = document.getElementById('mockConnectBtn');
        if (mockBtn) {
            mockBtn.addEventListener('click', () => {
                walletConnected = !walletConnected;
                if (walletConnected) {
                    currentWalletAddress = "EQDemosamplewalletaddress1234";
                    document.getElementById('ton-balance').innerHTML = '124.50 <span>TON</span>';
                    document.getElementById('yd-balance').innerHTML = '8750.00 <span>Y-D</span>';
                    document.getElementById('walletStatusMsg').innerHTML = '✅ Демо-кошелёк активен (балансы фиктивны)';
                } else {
                    currentWalletAddress = null;
                    document.getElementById('ton-balance').innerHTML = '0.00 <span>TON</span>';
                    document.getElementById('yd-balance').innerHTML = '0.00 <span>Y-D</span>';
                    document.getElementById('walletStatusMsg').innerHTML = 'Демо-режим: кошелёк отключён';
                }
            });
        }
    }
    
    // ============ ИСПРАВЛЕННАЯ ФУНКЦИЯ ПОЛУЧЕНИЯ БАЛАНСОВ ============
    async function fetchBalances() {
        if (!walletConnected || !currentWalletAddress) {
            console.warn("Кошелёк не подключён или адрес не задан");
            return;
        }
        
        console.log("Запрос баланса для адреса:", currentWalletAddress);
        if (!isValidTonAddress(currentWalletAddress)) {
            console.error("Неверный формат адреса:", currentWalletAddress);
            document.getElementById('walletStatusMsg').innerHTML = `⚠️ Неверный формат адреса: ${currentWalletAddress}`;
            document.getElementById('ton-balance').innerHTML = `? <span>TON</span>`;
            document.getElementById('yd-balance').innerHTML = `? <span>Y-D</span>`;
            return;
        }
        
        const api = getApiBase();
        // Формируем URL правильно: если в api нет знака вопроса, добавляем ?address=, иначе &address=
        const separator = api.includes('?') ? '&' : '?';
        const tonUrl = `${api}${separator}address=${encodeURIComponent(currentWalletAddress)}`;
        console.log("Запрос TON баланса:", tonUrl);
        
        try {
            const tonResp = await fetch(tonUrl);
            if (!tonResp.ok) throw new Error(`HTTP ${tonResp.status}`);
            const text = await tonResp.text();
            let tonData;
            try {
                tonData = JSON.parse(text);
            } catch (e) {
                throw new Error("Ответ не JSON: " + text.substring(0, 100));
            }
            if (tonData.ok && tonData.result && typeof tonData.result.balance !== 'undefined') {
                const balanceNano = parseInt(tonData.result.balance, 10);
                const tonBalanceFormatted = (balanceNano / 1e9).toFixed(4);
                document.getElementById('ton-balance').innerHTML = `${tonBalanceFormatted} <span>TON</span>`;
                document.getElementById('walletStatusMsg').innerHTML = `✅ Баланс TON: ${tonBalanceFormatted}`;
            } else {
                throw new Error("API вернул ошибку: " + JSON.stringify(tonData));
            }
        } catch (err) {
            console.error("Ошибка получения TON баланса:", err);
            document.getElementById('ton-balance').innerHTML = `⚠️ <span>TON</span>`;
            document.getElementById('walletStatusMsg').innerHTML = `❌ Ошибка TON: ${err.message}`;
        }
        
        // YD баланс – без изменений (пропускается, если мастер-адрес – заглушка)
        const isRealJettonMaster = YD_JETTON_MASTER && YD_JETTON_MASTER.startsWith('EQ') && YD_JETTON_MASTER !== 'EQDxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx';
        if (isRealJettonMaster) {
            try {
                const ydUrl = `${api}${separator}address=${YD_JETTON_MASTER}&method=getWalletByOwner&owner=${currentWalletAddress}`;
                const ydResp = await fetch(ydUrl);
                const ydData = await ydResp.json();
                if (ydData.ok && ydData.result && typeof ydData.result.balance !== 'undefined') {
                    const ydRaw = parseInt(ydData.result.balance, 10);
                    const ydFormatted = (ydRaw / 1e9).toFixed(2);
                    document.getElementById('yd-balance').innerHTML = `${ydFormatted} <span>Y-D</span>`;
                } else {
                    document.getElementById('yd-balance').innerHTML = `0.00 <span>Y-D</span>`;
                }
            } catch (err) {
                console.error("Ошибка YD баланса:", err);
                document.getElementById('yd-balance').innerHTML = `? <span>Y-D</span>`;
            }
        } else {
            document.getElementById('yd-balance').innerHTML = `0.00 <span>Y-D</span>`;
        }
    }
    
    function setNetwork(isTestnet) {
        currentNetwork = isTestnet ? 'testnet' : 'mainnet';
        const mainBtn = document.getElementById('mainnetBtn');
        const testBtn = document.getElementById('testnetBtn');
        if(isTestnet) { mainBtn.classList.remove('active'); testBtn.classList.add('active'); }
        else { testBtn.classList.remove('active'); mainBtn.classList.add('active'); }
        document.getElementById('walletStatusMsg').innerHTML = `🌐 Сеть: ${currentNetwork === 'mainnet' ? 'Mainnet' : 'Testnet'}. Обновите баланс.`;
        if(walletConnected) fetchBalances();
    }
    
    document.getElementById('mainnetBtn')?.addEventListener('click', () => setNetwork(false));
    document.getElementById('testnetBtn')?.addEventListener('click', () => setNetwork(true));
    document.getElementById('refreshBalanceBtn')?.addEventListener('click', () => { 
        if(walletConnected) fetchBalances(); 
        else document.getElementById('walletStatusMsg').innerHTML = 'Подключите кошелёк для обновления баланса'; 
    });
    
    // Замена эмодзи на иконки токенов
    function setTokenIcon(tokenName, iconUrl, altText) {
        const items = document.querySelectorAll('.balance-item');
        for (let item of items) {
            const titleElem = item.querySelector('.balance-info h4');
            if (titleElem && titleElem.innerText.trim() === tokenName) {
                const iconDiv = item.querySelector('.balance-icon');
                if (iconDiv) {
                    iconDiv.innerHTML = '';
                    const img = document.createElement('img');
                    img.src = iconUrl;
                    img.alt = altText;
                    img.style.width = '28px';
                    img.style.height = '28px';
                    img.style.objectFit = 'contain';
                    img.onerror = () => {
                        iconDiv.innerHTML = tokenName === 'TON' ? '⚡' : '🟡';
                        iconDiv.style.fontSize = '24px';
                    };
                    iconDiv.appendChild(img);
                }
                break;
            }
        }
    }
    
    const OFFICIAL_TON_ICON = 'https://cryptologos.cc/logos/toncoin-ton-logo.svg?v=024';
    setTokenIcon('TON', OFFICIAL_TON_ICON, 'TON Coin');
    
    async function loadYDTokenIconFromManifest() {
        try {
            const manifestUrl = 'https://binom0x.github.io/Y-bot/tonconnect-manifest.json';
            const response = await fetch(manifestUrl, { cache: 'force-cache' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const manifestData = await response.json();
            let ydIconUrl = manifestData.ydIconUrl || manifestData.iconUrl || (manifestData.icons?.[0]?.url);
            if (ydIconUrl) {
                if (ydIconUrl.startsWith('/')) {
                    const baseUrl = manifestUrl.substring(0, manifestUrl.lastIndexOf('/') + 1);
                    ydIconUrl = baseUrl + ydIconUrl.replace(/^\//, '');
                } else if (!ydIconUrl.startsWith('http')) {
                    const baseUrl = manifestUrl.substring(0, manifestUrl.lastIndexOf('/') + 1);
                    ydIconUrl = baseUrl + ydIconUrl;
                }
                setTokenIcon('Y-D', ydIconUrl, 'Y-D Token');
            } else {
                throw new Error('Нет иконки в манифесте');
            }
        } catch (err) {
            console.warn('Не удалось загрузить иконку Y-D:', err);
            const fallbackSvg = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%2330a2ff' /%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-weight='bold'%3EY-D%3C/text%3E%3C/svg%3E";
            setTokenIcon('Y-D', fallbackSvg, 'Y-D (заглушка)');
        }
    }
    
    window.addEventListener('DOMContentLoaded', () => {
        initTonConnect();
        loadYDTokenIconFromManifest();
    });
</script>
</body>
</html>
