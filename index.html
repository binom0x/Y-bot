<!DOCTYPE html>
<html>

<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Y - Ваш ключ от будущего!</title>
    <link rel="stylesheet" href="miniapp.css" type="text/css" media="all">
</head>

<body>

<main>
    <input id="tab1" type="radio" name="tabs" checked>
    <label for="tab1">Ваши данные</label>

    <input id="tab2" type="radio" name="tabs">
    <label for="tab2">Y-Карта</label>

    <input id="tab3" type="radio" name="tabs">
    <label for="tab3">Y-MBA</label>

    <input id="tab4" type="radio" name="tabs">
    <label for="tab4">Баланс</label>

    <section id="content1">
        <div class="dashboard">
            <div class="user-info">
                <h2>👤 Личная информация</h2>
                <p><strong>ID:</strong> <span id="user-id">—</span></p>
                <p><strong>Имя:</strong> <span id="user-name">—</span></p>
                <p><strong>Username:</strong> <span id="user-username">—</span></p>
            </div>
            <div id="qr-place"></div>
        </div>
    </section>

    <section id="content2">
        <h2>Y-Карта</h2>
        <p>
            <select id="card_programs" name="Y-card">
                <option value="">Выберите...</option>
            </select>
        </p>
        <p id="selected_program"></p>
        <div class="payment-method-block">
            <h3>Способ оплаты</h3>
            <label><input type="radio" name="payment_method_card" value="stars" checked> ⭐ Telegram Stars</label><br>
            <label><input type="radio" name="payment_method_card" value="card"> 💳 Банковская карта (Telegram)</label><br>
            <label><input type="radio" name="payment_method_card" value="yoomoney"> 💰 YooMoney</label>
        </div>
        <div class="offer-agreement">
            <input type="checkbox" id="agree-offer-card">
            <label for="agree-offer-card">
                Я ознакомлен(а) и согласен(сна) с условиями 
                <a href="javascript:void(0)" data-offer-type="card" class="offer-link">Публичной оферты (Y‑Карта)</a>
            </label>
        </div>
    </section>

    <section id="content3">
        <h2>Y-MBA</h2>
        <p>
            <select id="Y_cources" name="Y-MBA">
                <option value="">Выберите...</option>
            </select>
        </p>
        <p id="selected_cource"></p>
        <div class="payment-method-block">
            <h3>Способ оплаты</h3>
            <label><input type="radio" name="payment_method_mba" value="stars" checked> ⭐ Telegram Stars</label><br>
            <label><input type="radio" name="payment_method_mba" value="card"> 💳 Банковская карта (Telegram)</label><br>
            <label><input type="radio" name="payment_method_mba" value="yoomoney"> 💰 YooMoney</label>
        </div>
        <div class="offer-agreement">
            <input type="checkbox" id="agree-offer-mba">
            <label for="agree-offer-mba">
                Я ознакомлен(а) и согласен(сна) с условиями 
                <a href="javascript:void(0)" data-offer-type="mba" class="offer-link">Публичной оферты (Y‑MBA)</a>
            </label>
        </div>
    </section>

    <section id="content4">
        <h2>Баланс</h2>
        <div id="ton-connect-button"></div>
        <div id="ton-balance">—</div>
        <div id="yd-balance">—</div>
        <button onclick="setNetwork(false)">Mainnet</button>
        <button onclick="setNetwork(true)">Testnet</button>
        <button onclick="disconnectWallet()">Отключить</button>
    </section>
</main>

<div id="offerModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📄 Публичная оферта</h3>
            <span class="close-modal" id="closeModalBtn">&times;</span>
        </div>
        <div class="modal-body" id="modalOfferBody">
            <div style="text-align:center; padding: 30px;">Загрузка условий...</div>
        </div>
    </div>
</div>

<script>
    let c_programs = [];
    let y_cources = [];
    let selectedProduct = null;
    let tgUser = null;
    let tg = null;
    // Кэш для разных оферт
    let cachedOffers = {
        card: null,
        mba: null
    };

    function displayQRCode(container, text, size, color, margin = 2) {
        const target = typeof container === 'string' ? document.querySelector(container) : container;
        if (!target) { console.error('Контейнер для QR‑кода не найден'); return; }
        let darkColor = '#000000', lightColor = '#ffffff';
        if (typeof color === 'string') darkColor = color;
        else if (typeof color === 'object' && color !== null) { darkColor = color.dark || '#000000'; lightColor = color.light || '#ffffff'; }
        target.innerHTML = '';
        const canvas = document.createElement('canvas');
        target.appendChild(canvas);
        try {
            QRCode.toCanvas(canvas, text, { width: size, margin, color: { dark: darkColor, light: lightColor }, errorCorrectionLevel: 'M' }, (error) => {
                if (error) { console.error('Ошибка генерации QR:', error); target.innerHTML = '<p style="color:red;">Не удалось создать QR‑код</p>'; }
            });
        } catch(e) { console.error("Ошибка canvas:", e); }
    }

    if (window.Telegram && window.Telegram.WebApp) { tg = window.Telegram.WebApp; tg.ready(); tg.expand(); }
    else console.error("Telegram WebApp не найден.");

    function getTelegramUser() {
        if (!tg) return null;
        if (tg.initDataUnsafe?.user) return tg.initDataUnsafe.user;
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');
        if (userId) return { id: parseInt(userId, 10), first_name: decodeURIComponent(urlParams.get('first_name') || ''), username: decodeURIComponent(urlParams.get('username') || '') };
        return null;
    }

    const tgButtonColor = tg ? tg.themeParams.button_color || '#30a2ff' : '#30a2ff';
    tgUser = getTelegramUser();
    if (tgUser) {
        document.getElementById('user-id').innerHTML = tgUser.id.toString();
        document.getElementById('user-name').innerHTML = tgUser.first_name || 'Пользователь';
        document.getElementById('user-username').innerHTML = tgUser.username ? '@' + tgUser.username : '—';
        displayQRCode('#qr-place', tgUser.id.toString(), 180, tgButtonColor);
    } else {
        document.getElementById('user-id').innerHTML = "Не удалось определить пользователя.";
        displayQRCode('#qr-place', 'Пользователь не известен', 180, tgButtonColor);
    }

    function getSelectedPaymentMethod() {
        const activeTabId = document.querySelector('input[name="tabs"]:checked')?.id;
        if (activeTabId === 'tab2') return document.querySelector('#content2 input[name="payment_method_card"]:checked')?.value || 'stars';
        if (activeTabId === 'tab3') return document.querySelector('#content3 input[name="payment_method_mba"]:checked')?.value || 'stars';
        return 'stars';
    }

    function updateMainButton() {
        if (!tg) return;
        const activeTabId = document.querySelector('input[name="tabs"]:checked')?.id;
        if (!selectedProduct) { tg.MainButton.hide(); return; }
        const productTab = selectedProduct.type === 'card' ? 'tab2' : 'tab3';
        if (activeTabId === productTab) {
            let isOfferAccepted = false;
            if (selectedProduct.type === 'card') isOfferAccepted = document.getElementById('agree-offer-card')?.checked || false;
            else if (selectedProduct.type === 'mba') isOfferAccepted = document.getElementById('agree-offer-mba')?.checked || false;
            if (isOfferAccepted) { tg.MainButton.setParams({ is_visible: true, is_active: true, text: "Купить" }); tg.MainButton.show(); }
            else tg.MainButton.hide();
        } else tg.MainButton.hide();
    }

    function clearSelectedProduct() {
        selectedProduct = null;
        const cardSelect = document.getElementById('card_programs'), courseSelect = document.getElementById('Y_cources');
        if (cardSelect) cardSelect.selectedIndex = 0;
        if (courseSelect) courseSelect.selectedIndex = 0;
        document.getElementById('selected_program').innerHTML = 'Ничего не выбрано';
        document.getElementById('selected_cource').innerHTML = 'Ничего не выбрано';
        updateMainButton();
    }

    function updateSelectedProgram() {
        const select = document.getElementById('card_programs');
        const idx = select.selectedIndex;
        const display = document.getElementById('selected_program');
        if (idx > 0) {
            const item = c_programs[idx - 1];
            display.innerHTML = item.description;
            selectedProduct = { type: 'card', level: item.level, price: parseInt(item.price, 10) };
        } else { display.textContent = 'Ничего не выбрано'; if (selectedProduct?.type === 'card') selectedProduct = null; }
        updateMainButton();
    }

    function updateSelectedCource() {
        const select = document.getElementById('Y_cources');
        const idx = select.selectedIndex;
        const display = document.getElementById('selected_cource');
        if (idx > 0) {
            const item = y_cources[idx - 1];
            display.innerHTML = item.description;
            selectedProduct = { type: 'mba', level: item.level, price: parseInt(item.price, 10) };
        } else { display.textContent = 'Ничего не выбрано'; if (selectedProduct?.type === 'mba') selectedProduct = null; }
        updateMainButton();
    }

    fetch('content.json').then(r => r.json()).then(data => {
        c_programs = data[5].product;
        const s1 = document.getElementById('card_programs');
        c_programs.forEach(item => { let opt = document.createElement('option'); opt.value = item.level; opt.textContent = `${item.level} (${item.price} руб.)`; s1.appendChild(opt); });
        y_cources = data[6];
        const s2 = document.getElementById('Y_cources');
        y_cources.forEach(item => { let opt = document.createElement('option'); opt.value = item.level; opt.textContent = `${item.level} (${item.price} руб.)`; s2.appendChild(opt); });
    }).catch(err => console.error("Ошибка загрузки content.json:", err));

    // Загрузка оферты по типу (card / mba)
    function loadOfferByType(type) {
        if (cachedOffers[type]) return Promise.resolve(cachedOffers[type]);
        const fileName = type === 'card' ? 'offer_card.html' : 'offer_mba.html';
        return fetch(fileName)
            .then(response => {
                if (!response.ok) throw new Error(`Оферта ${fileName} не найдена`);
                return response.text();
            })
            .then(html => {
                cachedOffers[type] = html;
                return html;
            })
            .catch(err => {
                console.error(`Ошибка загрузки ${fileName}:`, err);
                const fallback = `<div style="color:red; padding:20px;">⚠️ Не удалось загрузить текст оферты для ${type === 'card' ? 'Y‑Карты' : 'Y‑MBA'}. Пожалуйста, попробуйте позже.</div>`;
                cachedOffers[type] = fallback;
                return fallback;
            });
    }

    function showOfferModal(offerType) {
        const modal = document.getElementById('offerModal'), body = document.getElementById('modalOfferBody');
        if (!modal) return;
        body.innerHTML = '<div style="text-align:center; padding: 30px;">⏳ Загрузка...</div>';
        modal.style.display = 'flex';
        loadOfferByType(offerType).then(html => {
            body.innerHTML = html;
        });
    }
    function closeOfferModal() { const modal = document.getElementById('offerModal'); if (modal) modal.style.display = 'none'; }

    // Обработчики кликов по ссылкам оферт
    document.querySelectorAll('.offer-link').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const offerType = link.getAttribute('data-offer-type');
            if (offerType) showOfferModal(offerType);
        });
    });
    document.getElementById('closeModalBtn')?.addEventListener('click', closeOfferModal);
    window.onclick = (event) => { if (event.target === document.getElementById('offerModal')) closeOfferModal(); };

    function bindAgreementCheckboxes() {
        document.getElementById('agree-offer-card')?.addEventListener('change', () => updateMainButton());
        document.getElementById('agree-offer-mba')?.addEventListener('change', () => updateMainButton());
    }
    function bindTabChange() { document.querySelectorAll('input[name="tabs"]').forEach(tab => tab.addEventListener('change', () => updateMainButton())); }

    document.addEventListener('DOMContentLoaded', () => {
        bindTabChange(); bindAgreementCheckboxes();
        document.getElementById('card_programs').addEventListener('change', updateSelectedProgram);
        document.getElementById('Y_cources').addEventListener('change', updateSelectedCource);
        updateSelectedProgram(); updateSelectedCource();
        if (tg) { tg.MainButton.setText("Купить"); tg.MainButton.hide(); setTimeout(() => updateMainButton(), 200); }
    });

    if (tg) {
        tg.MainButton.onClick(() => {
            if (!selectedProduct) { tg.showAlert("Выберите продукт"); return; }
            let isAccepted = (selectedProduct.type === 'card') ? document.getElementById('agree-offer-card')?.checked : document.getElementById('agree-offer-mba')?.checked;
            if (!isAccepted) { tg.showAlert("Подтвердите согласие с офертой"); return; }
            tg.sendData(JSON.stringify({ type: selectedProduct.type, level: selectedProduct.level, price: selectedProduct.price, payment_method: getSelectedPaymentMethod() }));
            clearSelectedProduct();
            tg.showAlert("Запрос отправлен");
        });
    } else {
        window.setNetwork = (isTestnet) => { console.log("Network", isTestnet); alert("Демо"); };
        window.disconnectWallet = () => alert("Демо");
    }
</script>
</body>
</html>
