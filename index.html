	<script>
		c_programs = [];

		// Функция обновления отображения выбранного варианта программ
		function updateSelectedProgram() {
		  const select = document.getElementById('card_programs');
		  const selectedIndex = select.selectedIndex;
		  const displayElement = document.getElementById('selected_program');

		  if (selectedIndex > 0) { // Пропускаем первую опцию («Выберите...»)
			const selectedOption = select.options[selectedIndex];
			const description = c_programs[selectedIndex+1].description
			displayElement.textContent = description; //selectedOption.textContent;
		  } else {
			displayElement.textContent = 'Ничего не выбрано';
		  }
		}	
	
		// Загрузить контент из файла JSON
		fetch('content.json')
 			.then(response => response.json())
  			.then(jsonData => {
				let data = jsonData;
				//document.getElementById('txt1').innerHTML = d_text[1];
				//document.getElementById('txt2').innerHTML = d_text[2];
				document.getElementById('txt3').innerHTML = data[3];
				//document.getElementById('txt4').innerHTML = d_text[4];
				//document.getElementById('txt5').innerHTML = data[5];
				document.getElementById('txt6').innerHTML = data[6];
				document.getElementById('txt7').innerHTML = data[7]
				// Список программ по карте
				c_programs = data[5].product; 
				const select = document.getElementById('card_programs');
				for (const item of c_programs) {
				  const option = document.createElement('option');
				  option.value = item.level;
				  option.textContent = `${item.level} (${item.price} руб.)`;
				  select.appendChild(option);
				}
			}); 
		// Добавляем обработчик выбора программы
		document.addEventListener('DOMContentLoaded', function() {
		  updateSelectedProgram(); // Устанавливаем начальное состояние
		  document.getElementById('card_programs').addEventListener('change', updateSelectedProgram);
		});
