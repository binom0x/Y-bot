<!DOCTYPE html>
<html>

<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Y - Ваш ключ от будущего!</title>
    <link rel="stylesheet" href="miniapp.css" type="text/css" media="all">
</head>

<body>

<main>
    <input id="tab1" type="radio" name="tabs" checked>
    <label for="tab1">Ваши данные</label>

    <input id="tab2" type="radio" name="tabs">
    <label for="tab2">Y-Карта</label>

    <input id="tab3" type="radio" name="tabs">
    <label for="tab3">Y-MBA</label>

    <input id="tab4" type="radio" name="tabs">
    <label for="tab4">Баланс</label>

    <section id="content1">
        <div class="dashboard">
            <div class="user-info">
                <h2>👤 Личная информация</h2>
                <p><strong>ID:</strong> <span id="user-id">—</span></p>
                <p><strong>Имя:</strong> <span id="user-name">—</span></p>
                <p><strong>Username:</strong> <span id="user-username">—</span></p>
            </div>
            <div id="qr-place"></div>
        </div>
    </section>

    <section id="content2">
        <h2>Y-Карта</h2>
        <p>
            <select id="card_programs" name="Y-card">
                <option value="">Выберите...</option>
            </select>
        </p>
        <p id="selected_program"></p>
        <div class="payment-method-block">
            <h3>Способ оплаты</h3>
            <label><input type="radio" name="payment_method_card" value="stars" checked> ⭐ Telegram Stars</label><br>
            <label><input type="radio" name="payment_method_card" value="card"> 💳 Банковская карта (Telegram)</label><br>
            <label><input type="radio" name="payment_method_card" value="yoomoney"> 💰 YooMoney</label>
        </div>
        <div class="offer-agreement">
            <input type="checkbox" id="agree-offer-card">
            <label for="agree-offer-card">
                Я ознакомлен(а) и согласен(сна) с условиями 
                <a href="javascript:void(0)" id="show-offer-card-link" class="offer-link">Публичной оферты</a>
            </label>
        </div>
    </section>

    <section id="content3">
        <h2>Y-MBA</h2>
        <p>
            <select id="Y_cources" name="Y-MBA">
                <option value="">Выберите...</option>
            </select>
        </p>
        <p id="selected_cource"></p>
        <div class="payment-method-block">
            <h3>Способ оплаты</h3>
            <label><input type="radio" name="payment_method_mba" value="stars" checked> ⭐ Telegram Stars</label><br>
            <label><input type="radio" name="payment_method_mba" value="card"> 💳 Банковская карта (Telegram)</label><br>
            <label><input type="radio" name="payment_method_mba" value="yoomoney"> 💰 YooMoney</label>
        </div>
        <div class="offer-agreement">
            <input type="checkbox" id="agree-offer-mba">
            <label for="agree-offer-mba">
                Я ознакомлен(а) и согласен(сна) с условиями 
                <a href="javascript:void(0)" id="show-offer-mba-link" class="offer-link">Публичной оферты</a>
            </label>
        </div>
    </section>

    <section id="content4">
        <h2>Баланс</h2>
        <div id="ton-connect-button"></div>
        <div id="ton-balance">—</div>
        <div id="yd-balance">—</div>
        <button onclick="setNetwork(false)">Mainnet</button>
        <button onclick="setNetwork(true)">Testnet</button>
        <button onclick="disconnectWallet()">Отключить</button>
    </section>
</main>

<!-- Модальное окно для оферты -->
<div id="offerModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📄 Публичная оферта</h3>
            <span class="close-modal" id="closeModalBtn">&times;</span>
        </div>
        <div class="modal-body" id="modalOfferBody">
            <div style="text-align:center; padding: 30px;">Загрузка условий...</div>
        </div>
    </div>
</div>

<script>
    let c_programs = [];
    let y_cources = [];
    let selectedProduct = null;
    let tgUser = null;
    let tg = null;
    let cachedOfferHTML = null;

    function displayQRCode(container, text, size, color, margin = 2) {
        const target = typeof container === 'string' 
            ? document.querySelector(container) 
            : container;
        if (!target) {
            console.error('Контейнер для QR‑кода не найден');
            return;
        }
        let darkColor = '#000000';
        let lightColor = '#ffffff';
        if (typeof color === 'string') {
            darkColor = color;
        } else if (typeof color === 'object' && color !== null) {
            darkColor = color.dark || '#000000';
            lightColor = color.light || '#ffffff';
        }
        target.innerHTML = '';
        const canvas = document.createElement('canvas');
        target.appendChild(canvas);
        try {
            QRCode.toCanvas(canvas, text, {
                width: size,
                margin: margin,
                color: { dark: darkColor, light: lightColor },
                errorCorrectionLevel: 'M'
            }, (error) => {
                if (error) {
                    console.error('Ошибка генерации QR:', error);
                    target.innerHTML = '<p style="color:red;">Не удалось создать QR‑код</p>';
                }
            });
        } catch(e) {
            console.error("Ошибка canvas:", e);
        }
    }

    if (window.Telegram && window.Telegram.WebApp) {
        tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
    } else {
        console.error("Telegram WebApp не найден.");
    }

    function getTelegramUser() {
        if (!tg) return null;
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            return tg.initDataUnsafe.user;
        }
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');
        if (userId) {
            return {
                id: parseInt(userId, 10),
                first_name: decodeURIComponent(urlParams.get('first_name') || ''),
                username: decodeURIComponent(urlParams.get('username') || '')
            };
        }
        return null;
    }

    const tgButtonColor = tg ? tg.themeParams.button_color || '#30a2ff' : '#30a2ff';
    tgUser = getTelegramUser();

    if (tgUser) {
        document.getElementById('user-id').innerHTML = tgUser.id.toString();
        document.getElementById('user-name').innerHTML = tgUser.first_name || 'Пользователь';
        document.getElementById('user-username').innerHTML = tgUser.username ? '@' + tgUser.username : '—';
        displayQRCode('#qr-place', tgUser.id.toString(), 180, tgButtonColor);
    } else {
        document.getElementById('user-id').innerHTML = "Не удалось определить пользователя.";
        displayQRCode('#qr-place', 'Пользователь не известен', 180, tgButtonColor);
    }

    function getSelectedPaymentMethod() {
        const activeTabId = document.querySelector('input[name="tabs"]:checked')?.id;
        if (activeTabId === 'tab2') {
            const radio = document.querySelector('#content2 input[name="payment_method_card"]:checked');
            return radio ? radio.value : 'stars';
        } else if (activeTabId === 'tab3') {
            const radio = document.querySelector('#content3 input[name="payment_method_mba"]:checked');
            return radio ? radio.value : 'stars';
        }
        return 'stars';
    }

    function updateMainButton() {
        if (!tg) return;
        const activeTabId = document.querySelector('input[name="tabs"]:checked')?.id;
        if (!selectedProduct) {
            tg.MainButton.hide();
            return;
        }
        const productTab = selectedProduct.type === 'card' ? 'tab2' : 'tab3';
        if (activeTabId === productTab) {
            let isOfferAccepted = false;
            if (selectedProduct.type === 'card') {
                const chk = document.getElementById('agree-offer-card');
                isOfferAccepted = chk ? chk.checked : false;
            } else if (selectedProduct.type === 'mba') {
                const chk = document.getElementById('agree-offer-mba');
                isOfferAccepted = chk ? chk.checked : false;
            }
            if (isOfferAccepted) {
                tg.MainButton.setParams({ is_visible: true, is_active: true, text: "Купить" });
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        } else {
            tg.MainButton.hide();
        }
    }

    function clearSelectedProduct() {
        selectedProduct = null;
        const cardSelect = document.getElementById('card_programs');
        const courseSelect = document.getElementById('Y_cources');
        if (cardSelect) cardSelect.selectedIndex = 0;
        if (courseSelect) courseSelect.selectedIndex = 0;
        document.getElementById('selected_program').innerHTML = 'Ничего не выбрано';
        document.getElementById('selected_cource').innerHTML = 'Ничего не выбрано';
        updateMainButton();
    }

    function updateSelectedProgram() {
        const select = document.getElementById('card_programs');
        const selectedIndex = select.selectedIndex;
        const displayElement = document.getElementById('selected_program');
        if (selectedIndex > 0) {
            const item = c_programs[selectedIndex - 1];
            displayElement.innerHTML = item.description;
            selectedProduct = { type: 'card', level: item.level, price: parseInt(item.price, 10) };
        } else {
            displayElement.textContent = 'Ничего не выбрано';
            if (selectedProduct && selectedProduct.type === 'card') selectedProduct = null;
        }
        updateMainButton();
    }

    function updateSelectedCource() {
        const select = document.getElementById('Y_cources');
        const selectedIndex = select.selectedIndex;
        const displayElement = document.getElementById('selected_cource');
        if (selectedIndex > 0) {
            const item = y_cources[selectedIndex - 1];
            displayElement.innerHTML = item.description;
            selectedProduct = { type: 'mba', level: item.level, price: parseInt(item.price, 10) };
        } else {
            displayElement.textContent = 'Ничего не выбрано';
            if (selectedProduct && selectedProduct.type === 'mba') selectedProduct = null;
        }
        updateMainButton();
    }

    fetch('content.json')
        .then(response => response.json())
        .then(jsonData => {
            c_programs = jsonData[5].product;
            const select1 = document.getElementById('card_programs');
            for (const item of c_programs) {
                const option = document.createElement('option');
                option.value = item.level;
                option.textContent = `${item.level} (${item.price} руб.)`;
                select1.appendChild(option);
            }
            y_cources = jsonData[6];
            const select2 = document.getElementById('Y_cources');
            for (const item of y_cources) {
                const option = document.createElement('option');
                option.value = item.level;
                option.textContent = `${item.level} (${item.price} руб.)`;
                select2.appendChild(option);
            }
        })
        .catch(err => console.error("Ошибка загрузки content.json:", err));

    function loadAndCacheOffer() {
        if (cachedOfferHTML) return Promise.resolve(cachedOfferHTML);
        return fetch('offer.html')
            .then(response => { if (!response.ok) throw new Error(); return response.text(); })
            .then(html => { cachedOfferHTML = html; return cachedOfferHTML; })
            .catch(() => { cachedOfferHTML = '<div style="color:red; padding:20px;">⚠️ Не удалось загрузить текст оферты.</div>'; return cachedOfferHTML; });
    }

    function showOfferModal() {
        const modal = document.getElementById('offerModal');
        const modalBody = document.getElementById('modalOfferBody');
        if (!modal) return;
        if (cachedOfferHTML) {
            modalBody.innerHTML = cachedOfferHTML;
        } else {
            modalBody.innerHTML = '<div style="text-align:center; padding: 30px;">⏳ Загрузка...</div>';
            loadAndCacheOffer().then(html => { modalBody.innerHTML = html; });
        }
        modal.classList.add('show-modal');  // гарантия отображения
        modal.style.display = 'flex';
    }

    function closeOfferModal() {
        const modal = document.getElementById('offerModal');
        if (modal) {
            modal.classList.remove('show-modal');
            modal.style.display = 'none';
        }
    }

    loadAndCacheOffer();

    // Прямая привязка к ссылкам
    document.getElementById('show-offer-card-link')?.addEventListener('click', (e) => { e.preventDefault(); showOfferModal(); });
    document.getElementById('show-offer-mba-link')?.addEventListener('click', (e) => { e.preventDefault(); showOfferModal(); });
    const closeBtn = document.getElementById('closeModalBtn');
    if (closeBtn) closeBtn.onclick = closeOfferModal;
    window.onclick = function(event) {
        const modal = document.getElementById('offerModal');
        if (event.target === modal) closeOfferModal();
    };

    function bindAgreementCheckboxes() {
        const cardCheckbox = document.getElementById('agree-offer-card');
        const mbaCheckbox = document.getElementById('agree-offer-mba');
        if (cardCheckbox) cardCheckbox.addEventListener('change', () => updateMainButton());
        if (mbaCheckbox) mbaCheckbox.addEventListener('change', () => updateMainButton());
    }

    function bindTabChange() {
        document.querySelectorAll('input[name="tabs"]').forEach(tab => {
            tab.addEventListener('change', () => updateMainButton());
        });
    }

    document.addEventListener('DOMContentLoaded', function () {
        bindTabChange();
        bindAgreementCheckboxes();
        document.getElementById('card_programs').addEventListener('change', updateSelectedProgram);
        document.getElementById('Y_cources').addEventListener('change', updateSelectedCource);
        updateSelectedProgram();
        updateSelectedCource();
        if (tg) {
            tg.MainButton.setText("Купить");
            tg.MainButton.hide();
            setTimeout(() => updateMainButton(), 200);
        }
    });

    if (tg) {
        tg.MainButton.onClick(() => {
            if (!selectedProduct) {
                tg.showAlert("Выберите продукт");
                return;
            }
            let isAccepted = false;
            if (selectedProduct.type === 'card') isAccepted = document.getElementById('agree-offer-card')?.checked;
            else isAccepted = document.getElementById('agree-offer-mba')?.checked;
            if (!isAccepted) {
                tg.showAlert("Подтвердите согласие с офертой");
                return;
            }
            const payload = {
                type: selectedProduct.type,
                level: selectedProduct.level,
                price: selectedProduct.price,
                payment_method: getSelectedPaymentMethod()
            };
            tg.sendData(JSON.stringify(payload));
            clearSelectedProduct();
            tg.showAlert("Запрос отправлен");
        });
    } else {
        window.setNetwork = function(isTestnet) { console.log("Network", isTestnet); alert("Демо"); };
        window.disconnectWallet = function() { alert("Демо"); };
    }
</script>

</body>
</html>
